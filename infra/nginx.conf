server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location / { try_files $uri $uri/ $uri.html =404; add_header Cache-Control "no-cache" always; }
    location /_next/static/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location = /deployment.json { add_header Cache-Control "no-store" always; }
}
