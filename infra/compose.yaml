name: jenkins-pract
services:
  jenkins:
    image: jenkins/jenkins:lts-jdk21
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./jenkins_home:/var/jenkins_home
      - ./deployment:/var/jenkins_deploy
  tienda:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:80"
    volumes:
      - ./deployment:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
